<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OEX Frontend Test Coverage</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background: #f4f6fa;
        font-family: Arial, sans-serif;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        color: #fff;
        background: #002060;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }

      nav strong {
        margin-right: 12px;
      }

      nav button,
      nav a {
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      nav button:hover,
      nav a:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      nav .spacer {
        flex: 1;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Coverage navigation">
      <strong>OEX Frontend Coverage</strong>
      <button type="button" onclick="document.getElementById('report').contentWindow.history.back()">
        ← Back
      </button>
      <button
        type="button"
        onclick="document.getElementById('report').contentWindow.history.forward()"
      >
        Forward →
      </button>
      <button
        type="button"
        onclick="document.getElementById('report').src='/coverage/index.html'"
      >
        Coverage Home
      </button>
      <button
        type="button"
        onclick="document.getElementById('report').contentWindow.location.reload()"
      >
        Reload
      </button>
      <span class="spacer"></span>
      <a href="http://localhost:5002/testcoverage.html" target="_blank" rel="noreferrer">
        Backend Coverage
      </a>
      <a href="http://localhost:5002/api/docs" target="_blank" rel="noreferrer">Swagger</a>
      <a href="/" target="_blank" rel="noreferrer">OEX App</a>
    </nav>
    <iframe
      id="report"
      name="report"
      src="/coverage/index.html"
      title="Frontend Vitest coverage report"
    ></iframe>
  </body>
</html>
