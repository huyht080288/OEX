services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oex
      POSTGRES_USER: oex
      POSTGRES_PASSWORD: oex
    volumes:
      - oex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oex -d oex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oex_pgdata:
